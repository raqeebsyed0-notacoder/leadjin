name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      LEADJIN_ADMIN_SECRET: ci-test-secret-not-real
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build server
        run: npm run build:server
      - name: Build app
        run: npm run build
      - name: Start service
        run: |
          npm run start > /tmp/leadjin-ci.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/api/health > /dev/null; then echo "service up"; exit 0; fi
            sleep 2
          done
          echo "service failed to start"; tail -30 /tmp/leadjin-ci.log; exit 1
      - name: Tests
        run: npx vitest run
