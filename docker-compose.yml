services:
  leadjin:
    build: .
    container_name: leadjin
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/leadjin.db
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./leadjin.db:/app/leadjin.db
